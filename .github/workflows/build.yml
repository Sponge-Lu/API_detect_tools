name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.1.11)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    strategy:
      # 单个平台失败不再取消其余平台，便于一次看清所有平台的失败点
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          $ErrorActionPreference = 'Stop'
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { throw 'apt-get update failed' }
          sudo apt-get install -y unzip libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libxcb-dri3-0
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          # 打包校验会真实启动内置 Chromium，它比 Electron 打包额外需要这些运行库；
          # Ubuntu 24.04 起部分包改名为 *t64，逐个安装并容忍个别缺失（缺库会在校验步骤暴露）。
          $browserLibs = @(
            'libasound2t64', 'libasound2',
            'libcups2t64', 'libcups2',
            'libatk-bridge2.0-0t64', 'libatk-bridge2.0-0',
            'libxkbcommon0', 'libcairo2', 'libpango-1.0-0', 'libpangoft2-1.0-0',
            'libxcomposite1', 'libxdamage1', 'libxrandr2', 'libxfixes3',
            'libwayland-client0', 'libxshmfence1'
          )
          foreach ($pkg in $browserLibs) {
            sudo apt-get install -y $pkg 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Host "installed $pkg" }
          }

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

      - name: Verify runtime behavior
        run: |
          $ErrorActionPreference = 'Stop'
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Runtime regression tests failed' }

      - name: Build application
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Build for ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged application and browser
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = '${{ matrix.platform }}'
          $targetArch = '${{ matrix.arch }}'
          if ($platform -eq 'mac') {
            $resourceRoot = (Get-ChildItem release -Directory -Filter 'mac*' | Get-ChildItem -Directory -Filter '*.app' | Select-Object -First 1).FullName + '/Contents/Resources'
            $targetPlatform = 'darwin'
          } elseif ($platform -eq 'win') {
            $resourceRoot = 'release/win-unpacked/resources'
            $targetPlatform = 'win32'
          } else {
            $resourceRoot = 'release/linux-unpacked/resources'
            $targetPlatform = 'linux'
          }
          npm run verify:packaged -- $resourceRoot $targetPlatform $targetArch
          if ($LASTEXITCODE -ne 0) {
            # 失败时把关键诊断信息写进注解（Actions 日志需鉴权，注解公开可读）
            if ($targetPlatform -eq 'linux') {
              $chrome = Join-Path $resourceRoot "chromium/linux-$targetArch/chrome"
              if (Test-Path $chrome) {
                Write-Host "chrome binary: $chrome"
                $missing = & ldd $chrome 2>&1 | Select-String 'not found'
                if ($missing) {
                  foreach ($line in $missing) { Write-Host "::error::missing shared library -> $line" }
                } else {
                  Write-Host '::error::no missing shared libraries reported by ldd'
                }
                Get-ChildItem $resourceRoot/chromium -Directory | ForEach-Object {
                  Write-Host "chromium dir: $($_.Name)"
                }
              } else {
                Write-Host "::error::chrome binary not found at $chrome"
              }
            }
            throw 'Packaged runtime verification failed'
          }

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete existing release (if any)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              console.log(`Deleted existing release for tag ${tag}`);
            } catch (e) {
              if (e.status === 404) {
                console.log(`No existing release for tag ${tag}, proceeding...`);
              } else {
                throw e;
              }
            }

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
