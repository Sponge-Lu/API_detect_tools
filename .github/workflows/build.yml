name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.1.11)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          $ErrorActionPreference = 'Stop'
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { throw 'apt-get update failed' }
          sudo apt-get install -y unzip libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libxcb-dri3-0
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

      - name: Verify runtime behavior
        run: |
          $ErrorActionPreference = 'Stop'
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Runtime regression tests failed' }

      - name: Build application
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Build for ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged application and browser
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = '${{ matrix.platform }}'
          $targetArch = '${{ matrix.arch }}'
          if ($platform -eq 'mac') {
            $resourceRoot = (Get-ChildItem release -Directory -Filter 'mac*' | Get-ChildItem -Directory -Filter '*.app' | Select-Object -First 1).FullName + '/Contents/Resources'
            $targetPlatform = 'darwin'
          } elseif ($platform -eq 'win') {
            $resourceRoot = 'release/win-unpacked/resources'
            $targetPlatform = 'win32'
          } else {
            $resourceRoot = 'release/linux-unpacked/resources'
            $targetPlatform = 'linux'
          }
          npm run verify:packaged -- $resourceRoot $targetPlatform $targetArch
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime verification failed' }

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete existing release (if any)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              console.log(`Deleted existing release for tag ${tag}`);
            } catch (e) {
              if (e.status === 404) {
                console.log(`No existing release for tag ${tag}, proceeding...`);
              } else {
                throw e;
              }
            }

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
